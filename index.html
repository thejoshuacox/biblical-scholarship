<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (() => {
        const root = document.documentElement;
        let savedTheme;
        try {
          savedTheme = localStorage.getItem('biblical-text-theme');
        } catch {
          // The device preference still works when storage is unavailable.
        }
        if (savedTheme === 'light' || savedTheme === 'dark') {
          root.dataset.themePreference = savedTheme;
        }
        root.dataset.theme =
          root.dataset.themePreference ??
          (matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light');
      })();
    </script>
    <meta
      name="description"
      content="Read biblical passages side by side and learn how scholars explain them, with sources you can follow. No background in biblical studies needed."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Biblical Text &amp; Context — Explore Biblical Scholarship</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
